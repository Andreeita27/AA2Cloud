apiVersion: v1
kind: Service
metadata:
  name: temperaturas-backend
  labels:
    app: backend-temperaturas
spec:
  clusterIP: None
  ports:
    - port: 5000
  selector:
    app: backend-temperaturas
    tier: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temperaturas-backend
  labels:
    app: backend-temperaturas
spec:
  selector:
    matchLabels:
      app: backend-temperaturas
      tier: backend
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: backend-temperaturas
        tier: backend
    spec:
      containers:
        - name: temperaturas-backend
          image: afernandez28707/temperaturas-backend:latest
          ports:
            - containerPort: 5000
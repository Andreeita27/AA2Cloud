name: CI/CD Frontend

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build Docker image and push to repositories
    runs-on: ubuntu-latest

    steps:
    # Paso 1 - Descarga el código del repositorio
    - name: Checkout code
      uses: actions/checkout@v3

    # Paso 2 - Login en Docker Hub con secrets
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Paso 3 - Construye la imagen del frontend y la sube a Docker Hub
    # Esto sería la parte de CI
    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        push: true
        tags: afernandez28707/temperaturas-frontend:${{ github.sha }}

    # Paso 4 - Se conecta por SSH a la máquina y actualiza la imagen del deployment
    # Esto sería la parte de CD
    - name: Deploy to EKS
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          kubectl set image deployment/temperaturas-frontend temperaturas-frontend=afernandez28707/temperaturas-frontend:${{ github.sha }}